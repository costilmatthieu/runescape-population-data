
[project]
name = "gielinor-population"
version = "0.1.0"
description = "An empirical investigation into the population dynamics of RuneScape and Old School RuneScape."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.4",
    "pandas>=2.2",
    "pyarrow>=20.0",
    "plotly>=6.0",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "ruptures>=1.1.9",
]

[dependency-groups]
dev = [
    "marimo>=0.14",
    "pytest>=8.3",
    "ruff>=0.11",
]

viz-export = [
    "kaleido>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gielinor_population"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
